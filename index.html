<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo List</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 400px;
    margin: 40px auto;
    background: #faf3f3;

  }

  h1 {
    text-align: center;
  }

  .input {
    width: 70%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .btn {
    padding: 8px 12px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .list {
    list-style: none;
    padding: 0;
    margin-top: 20px;
  }

  .task {
    display: flex;
    align-items: center;
    background: white;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .task-text {
    flex: 1;
    margin: 0 10px;
  }

  .done {
    text-decoration: line-through;
    color: gray;
  }
  .clear-btn {
    padding: 8px 12px;
    background: #dc3545;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 20px;
  }
</style>
</head>
<body>

  <h1>Todo List</h1>

  <form class="form">
    <input type="text" class="input" placeholder="Add a task">
    <button type="submit" class="btn">Add</button>
  </form>
  <h3>Tasks</h3>
  <ul class="list">
    <!-- tasks will go here -->
  </ul>
  <button class="clear-btn" id="clear">Clear All</button>

  <script src="todo.js"></script>
</body>
</html>
